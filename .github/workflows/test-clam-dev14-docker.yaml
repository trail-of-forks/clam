# Workflow to build and test clam after each push or pull request

name: CI-dev20

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the dev20 branch
  push:
    branches: dev20
  pull_request:
    branches: dev20

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "test"
  test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Check out repo
        uses: actions/checkout@v2
        with:
          ref: dev20
      - name: Build clam and run tests
        run: docker build -t seahorn/clam-llvm20:nightly -f docker/clam.Dockerfile .
